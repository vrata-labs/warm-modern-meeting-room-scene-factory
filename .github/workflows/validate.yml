name: Validate experiment

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_01_DIR: ${{ github.workspace }}/candidate-01
    defaults:
      run:
        working-directory: experiment
    steps:
      - name: Checkout experiment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: experiment

      - name: Checkout locked Candidate 01
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vrata-labs/warm-modern-meeting-room-candidate-01
          ref: 26d3af6e2720576113431c22b9443533b919f390
          fetch-depth: 0
          path: candidate-01

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: experiment/pnpm-lock.yaml

      - name: Setup Python for static TRELLIS syntax policy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate experiment boundary and contracts
        run: pnpm validate

      - name: Install exact Blender
        run: |
          curl --fail --location --silent --show-error \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/blender-4.5.12-linux-x64.tar.xz"
          printf '%s  %s\n' \
            '95e3a2dfedba3bd32ca54fc355eac6b15a11986954ccb02815a07535d0120a25' \
            "$RUNNER_TEMP/blender-4.5.12-linux-x64.tar.xz" | sha256sum --check --strict
          tar --extract --file "$RUNNER_TEMP/blender-4.5.12-linux-x64.tar.xz" --directory "$RUNNER_TEMP"
          printf 'BLENDER_BIN=%s\n' "$RUNNER_TEMP/blender-4.5.12-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Run all tests including exact-Blender Candidate 01 component gate
        run: pnpm test
